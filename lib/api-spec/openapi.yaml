openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: streamChat
      tags: [chat]
      summary: Stream an AI assistant response
      description: Sends the current conversation to Groq and streams the assistant response as server-sent events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Stream of assistant response chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid chat input
        "429":
          description: Rate limit exceeded
        "500":
          description: Assistant unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - role
        - content
    ChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - messages

